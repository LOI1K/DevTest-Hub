name: DevTest Hub CI/CD

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python — Backend и Worker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devtest
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: devtesthub_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U devtest -d devtesthub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: devtest
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: devtesthub_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5434"
      JWT_SECRET_KEY: ci_only_secret_key_for_automated_testing_2026
      PYTHONPATH: backend

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            worker/requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r worker/requirements.txt

      - name: Применение миграций Alembic
        run: python -m alembic upgrade head

      - name: Проверка Python-кода
        run: python -m compileall -q backend worker

      - name: Запуск тестов Backend и Worker
        run: python -m pytest backend/tests worker/tests -q

  frontend-tests:
    name: Frontend — тесты и сборка
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск тестов Frontend
        run: npm exec -- vitest run

      - name: Production-сборка Frontend
        run: npm run build

  docker-build:
    name: Docker — сборка FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Сборка Docker-образа
        run: |
          docker build \
            -t devtest-hub-fastapi-postgres:ci \
            templates/fastapi-postgres/api

  publish-image:
    name: CD — публикация Docker-образа
    runs-on: ubuntu-latest

    needs:
      - python-tests
      - frontend-tests
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: templates/fastapi-postgres/api
          push: true
          tags: |
            ghcr.io/loi1k/devtest-hub-fastapi-postgres:latest
            ghcr.io/loi1k/devtest-hub-fastapi-postgres:${{ github.sha }}
