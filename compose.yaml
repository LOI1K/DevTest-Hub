services:
  db:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: devtesthub_test

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  postgres_test_data:
