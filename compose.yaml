services:
  db:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: devtesthub_test

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  postgres_test_data:
